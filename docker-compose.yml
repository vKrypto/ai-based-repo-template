services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: barebrilliant
      POSTGRES_PASSWORD: barebrilliant
      POSTGRES_DB: barebrilliant
    ports:
      - "5432:5432"
    volumes:
      - ./.postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barebrilliant"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://barebrilliant:barebrilliant@postgres:5432/barebrilliant
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
